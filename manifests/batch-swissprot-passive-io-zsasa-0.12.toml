# SwissProt-scale batch benchmark with zsasa 0.12.1 under a passive disk I/O policy.
#
# Same collection, settings and policy as batch-swissprot-passive-io.toml, with Lahuta rerun in
# the same session. zsasa's own --passive-io option is not used: both tools run under
# `taskpolicy -d passive`, as in the 0.9.0 grid.

id = "batch-swissprot-passive-io-zsasa-0-12"
status = "ready"

[dataset]
id = "swissprot_500k_pdb_passive_io"
expected_count = 550122
role = ["batch-throughput", "io-wait-stress"]
notes = "Same collection and settings as batch-swissprot-version-refresh; only the disk I/O policy differs."

[full_rerun]
source_kind = "full_rerun"
run_id_default = "v0_12_1_swissprot_passive_io"
n_points = 128
threads = [10]
runs = 1
warmup = 0
precisions = ["f32"]
modes = ["standard", "bitmask"]
prepare = "sync"
disk_io_policy = "passive"
rerun_zsasa = true
rerun_comparators = true
notes = "Every command runs under `taskpolicy -d passive`; see batch-swissprot-passive-io.toml for why. One measured run per command, as in the 0.9.0 grid."

[[full_rerun.jobs]]
tool = "zsasa_0_12_1"
threads = [10, 20, 40]
precisions = ["f32"]
modes = ["standard", "bitmask"]

[[full_rerun.jobs]]
tool = "lahuta"
threads = [10]
modes = ["bitmask"]
