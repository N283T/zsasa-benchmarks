# SwissProt-scale batch benchmark with zsasa 0.12.1 under the default disk I/O policy.
#
# The default-policy counterpart of batch-swissprot-passive-io-zsasa-0.12.toml: same
# collection, grid and one run per command, without `taskpolicy -d passive`. It replaces
# the 0.9.0 default-policy runs (batch-swissprot-version-refresh.toml) in the reports.

id = "batch-swissprot-default-io-zsasa-0-12"
status = "ready"

[dataset]
id = "swissprot_500k_pdb"
# The id is historical (nominal 500k); the collection holds 550,122 structures.
expected_count = 550122
role = ["batch-throughput", "io-wait-stress"]
notes = "Same collection and settings as batch-swissprot-passive-io-zsasa-0.12; only the disk I/O policy differs."

[full_rerun]
source_kind = "full_rerun"
run_id_default = "v0_12_1_swissprot_default_io"
n_points = 128
threads = [10]
runs = 1
warmup = 0
precisions = ["f32"]
modes = ["standard", "bitmask"]
prepare = "sync"
rerun_zsasa = true
rerun_comparators = true
notes = "Every command runs under the default disk I/O policy. One measured run per command, as in the passive-policy grid."

[[full_rerun.jobs]]
tool = "zsasa_0_12_1"
threads = [10, 20, 40]
precisions = ["f32"]
modes = ["standard", "bitmask"]

[[full_rerun.jobs]]
tool = "lahuta"
threads = [10]
modes = ["bitmask"]
