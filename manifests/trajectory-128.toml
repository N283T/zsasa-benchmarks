# Complete 128-point MD performance and native worker-scaling rerun.
#
# This matrix repeats the full native and wrapper exploration and reruns the
# comparators in the same session instead of reusing historical 100-point data.

id = "trajectory-128"
status = "ready"

[[datasets]]
id = "5wvo_C_analysis"
atoms = 3858
frames = 1001

[[datasets]]
id = "6sup_A_analysis"
atoms = 33377
frames = 1001

[[datasets]]
id = "5vz0_A_protein"
atoms = 17910
frames = 10001

[full_rerun]
source_kind = "full_rerun"
run_id_default = "v0_9_0_md_128"
zsasa_tool = "zsasa_0_9_0"
default_tools = [
  "zig",
  "zig_bitmask",
  "zsasa_mdtraj",
  "zsasa_mdtraj_bitmask",
  "zsasa_mdanalysis",
  "zsasa_mdanalysis_bitmask",
  "mdtraj",
  "mdsasa_bolt",
]
large_trajectory_tools = ["zig", "zig_bitmask", "mdsasa_bolt"]
n_points = 128
cli_precisions = ["f64", "f32"]
cli_bitmask_variants = [
  "single",
  "single_corrected",
  "per_frame",
  "cycle",
  "cycle_corrected",
]
stride = 1
threads = [10, 20, 40]
wrapper_threads = [10]
classifier = "naccess"
include_hydrogens = true
runs = 3
warmup = 1
prepare = "sync"
rerun_zsasa = true
rerun_comparators = true
output_base = "results/full_rerun/v0_9_0_md_128/md"
