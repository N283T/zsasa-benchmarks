# E. coli CIF zsasa 0.9.0 batch thread-overcommit plan (not adopted).
#
# Human AFDB mmCIF already covers parser, input-I/O, and worker-overcommit
# behavior, while E. coli PDB covers the smaller batch-throughput workload.
# Running this matrix would duplicate those adopted suites without adding a
# distinct benchmark question, so the plan is retained only for provenance.

id = "batch-ecoli-cif-zsasa-0-9-overcommit"
status = "not_adopted"
decision_date = "2026-07-16"
decision_reason = "Covered by the adopted Human AFDB mmCIF parser/I/O/thread-scaling suite and E. coli PDB batch-throughput suite."

[dataset]
id = "UP000000625_83333_ECOLI_v6_cif"
expected_count = 4370
role = ["batch-throughput", "thread-overcommit", "mmcif-native"]

[full_rerun]
source_kind = "full_rerun"
run_id_default = "v0_9_0_cif_overcommit"
n_points = 128
threads = [10, 20, 40, 80]
runs = 3
warmup = 3
precisions = ["f32"]
modes = ["bitmask"]
prepare = "sync"
af_model_fast = true
input_io = "auto"
rerun_zsasa = true
rerun_comparators = true
output_base = "results/full_rerun/v0_9_0_cif_overcommit/batch/ecoli_cif"

[[full_rerun.jobs]]
tool = "zsasa_0_9_0"
threads = [10, 20, 40, 80]
precisions = ["f32"]
modes = ["bitmask"]

[[full_rerun.jobs]]
tool = "lahuta"
threads = [10]
precisions = ["f32"]
modes = ["bitmask"]
