# Human AFDB (PDB) batch throughput with zsasa 0.12.1.
#
# zsasa runs the precision/mode grid at 10, 20 and 40 threads; the comparators
# run at 10 threads in the same session.

id = "batch-human-zsasa-0-12"
status = "ready"

[dataset]
id = "UP000005640_9606_HUMAN_v6_pdb"
expected_count = 23586
role = ["batch-throughput", "thread-overcommit"]

[full_rerun]
source_kind = "full_rerun"
run_id_default = "v0_12_1_batch"
n_points = 128
threads = [10, 20, 40]
runs = 3
warmup = 3
precisions = ["f64", "f32"]
modes = ["standard", "bitmask"]
prepare = "sync"
rerun_zsasa = true
rerun_comparators = true
output_base = "results/full_rerun/v0_12_1_batch/batch/human"

[[full_rerun.jobs]]
tool = "zsasa_0_12_1"
threads = [10, 20, 40]
precisions = ["f64", "f32"]
modes = ["standard", "bitmask"]

[[full_rerun.jobs]]
tool = "freesasa_batch"
threads = [10]

[[full_rerun.jobs]]
tool = "rustsasa"
threads = [10]

[[full_rerun.jobs]]
tool = "lahuta"
threads = [10]
modes = ["standard", "bitmask"]
