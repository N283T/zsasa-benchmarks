# 128-point MD performance and native worker-scaling rerun with zsasa 0.12.1.
#
# Same matrix as trajectory-128.toml. MDTraj and mdsasa-bolt are rerun in the
# same session on 5wvo_C and 6sup_A. On the 10,001-frame 5vz0_A trajectory only
# zsasa runs; its mdsasa-bolt rows stay those of run set v0_9_0_md_128, because
# the pinned comparator did not change and that run alone takes about four hours.

id = "trajectory-128-zsasa-0-12"
status = "ready"

[[datasets]]
id = "5wvo_C_analysis"
atoms = 3858
frames = 1001

[[datasets]]
id = "6sup_A_analysis"
atoms = 33377
frames = 1001

[[datasets]]
id = "5vz0_A_protein"
atoms = 17910
frames = 10001

[full_rerun]
source_kind = "full_rerun"
run_id_default = "v0_12_1_md_128"
zsasa_tool = "zsasa_0_12_1"
default_tools = [
  "zig",
  "zig_bitmask",
  "zsasa_mdtraj",
  "zsasa_mdtraj_bitmask",
  "zsasa_mdanalysis",
  "zsasa_mdanalysis_bitmask",
  "mdtraj",
  "mdsasa_bolt",
]
large_trajectory_tools = ["zig", "zig_bitmask"]
n_points = 128
cli_precisions = ["f64", "f32"]
cli_bitmask_variants = [
  "single",
  "single_corrected",
  "per_frame",
  "cycle",
  "cycle_corrected",
]
stride = 1
threads = [10, 20, 40]
wrapper_threads = [10]
classifier = "naccess"
include_hydrogens = true
runs = 3
warmup = 1
prepare = "sync"
rerun_zsasa = true
rerun_comparators = true
output_base = "results/full_rerun/v0_12_1_md_128/md"
