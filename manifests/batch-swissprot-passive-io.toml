# SwissProt-scale batch benchmark with a passive disk I/O policy for every tool.

id = "batch-swissprot-passive-io"
status = "planning"

[dataset]
id = "swissprot_500k_pdb_passive_io"
# The same 550,122 files as swissprot_500k_pdb. A separate id keeps these runs apart from the
# default-policy runs of the same commands in the database and the summary tables.
expected_count = 550122
role = ["batch-throughput", "io-wait-stress"]
notes = "Same collection and settings as batch-swissprot-version-refresh; only the disk I/O policy differs."

[full_rerun]
source_kind = "full_rerun"
run_id_default = "v0_9_0_swissprot_passive_io"
n_points = 128
threads = [10]
runs = 1
warmup = 0
precisions = ["f32"]
modes = ["standard", "bitmask"]
prepare = "sync"
disk_io_policy = "passive"
rerun_zsasa = true
rerun_comparators = true
notes = "Every command runs under `taskpolicy -d passive`. On the test machine an on-access file scanner checks each input inside open(), and macOS throttles the scanner's reads while a normal-priority tool reads from the same disk; the passive policy removes that throttling for zsasa and Lahuta alike. Same grid as batch-swissprot-version-refresh for zsasa 0.9.0 and Lahuta, one measured run per command. Run ids ending in _r1.._r3 hold three alternating rounds of the two 10-thread bitmask commands, taken before the grid to see the run-to-run spread."

[[full_rerun.jobs]]
tool = "zsasa_0_9_0"
threads = [10, 20, 40]
precisions = ["f32"]
modes = ["standard", "bitmask"]

[[full_rerun.jobs]]
tool = "lahuta"
threads = [10]
modes = ["bitmask"]
