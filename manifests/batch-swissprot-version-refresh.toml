# SwissProt-scale batch benchmark for zsasa release-refresh checks.

id = "batch-swissprot-version-refresh"
status = "planning"

[dataset]
id = "swissprot_500k_pdb"
expected_count = 500000
role = ["batch-throughput", "version-refresh", "io-wait-stress"]
notes = "Large SwissProt-scale PDB directory intended to stress zsasa batch I/O and CPU scheduling behavior."

[full_rerun]
source_kind = "full_rerun"
run_id_default = "version_refresh_20260629"
n_points = 128
threads = [10]
runs = 1
warmup = 0
precisions = ["f32"]
modes = ["standard", "bitmask"]
prepare = "sync"
rerun_zsasa = true
rerun_comparators = true
notes = "SwissProt-scale version-refresh benchmark for the 0.7.0 batch thread-overcommit change. 0.6.0 is measured at 10 threads because it caps explicit batch threads to CPU count; 0.7.0 is measured at 10, 20, and 40 workers to test CPU-cap removal on I/O-bound file sets. Lahuta is included only as a 10-thread bitmask comparator."

[[full_rerun.jobs]]
tool = "zsasa_0_6_0"
threads = [10]
precisions = ["f32"]
modes = ["standard", "bitmask"]

[[full_rerun.jobs]]
tool = "zsasa_0_7_0"
threads = [10, 20, 40]
precisions = ["f32"]
modes = ["standard", "bitmask"]

[[full_rerun.jobs]]
tool = "lahuta"
threads = [10]
modes = ["bitmask"]
